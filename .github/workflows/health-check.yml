name: Weekly Feed Health Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-feed-health
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run health check
        run: npx tsx scripts/health-check.ts 2>&1 | tee health-report.txt

      - name: Refresh build artifacts and manifest
        run: npm run build

      - name: Commit health overlay and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/feeds-health.json dist/manifest.json
          git diff --staged --quiet || git commit -m "chore(rss-registry): weekly health check update"
          git push

      - name: Reconcile feed health issues
        run: npx tsx scripts/reconcile-health-issues.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
