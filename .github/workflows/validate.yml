name: Validate Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Run tests
        run: npm test
      - name: Run validation + schema conformance
        run: npm run validate
      - name: Verify build artifacts are deterministic and up to date
        run: |
          npm run build
          git diff --exit-code -- dist/ ':!dist/manifest.json'
